name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    # Pinned so one commit cannot pass on one image and fail on another.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Gate (gofmt, vet, race tests, build, diff check)
        run: scripts/verify.sh
      # Pinned: an unpinned scanner changes the gate without any commit.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  postgres:
    name: postgres integration (disposable cluster)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install PostgreSQL 18 from PGDG
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-18
      # The script creates a private cluster under /tmp with no TCP listener
      # and destroys it; it never touches a configured server.
      - name: Integration
        env:
          LEASE_PG_BIN: /usr/lib/postgresql/18/bin
        run: scripts/test-postgres.sh
